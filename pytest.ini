[pytest]
testpaths = tests
pythonpath = send_to_x3
asyncio_mode = auto
markers =
    network: needs internet access (skipped unless SENDTOX3_NETWORK_TESTS=1)
    docker: needs a local docker daemon (skipped unless SENDTOX3_DOCKER_TESTS=1)
    firmware: builds/runs CrossPoint firmware code on the host (skipped unless SENDTOX3_FIRMWARE_TESTS=1)
